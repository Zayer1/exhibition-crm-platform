<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition CRM</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Exhibition CRM</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search exhibitors...">
                <button onclick="searchExhibitors()">Search</button>
                <button onclick="showFollowups()" style="background: linear-gradient(135deg, #10b981, #34d399);">Follow-ups</button>
            </div>
        </header>
        
        <main>
            <section class="results-panel" id="resultsPanel">
                <!-- Search results will populate here -->
            </section>
            
            <section class="details-panel hidden" id="detailsPanel">
                <!-- Opportunity details will populate here -->
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
